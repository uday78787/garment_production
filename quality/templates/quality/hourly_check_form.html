{% extends 'base.html' %}
{% block title %}Hourly Quality Check{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Hourly End-of-Line Quality Check</h3>
    <a href="{% url 'quality:hourly_check_list' %}" class="btn btn-outline-secondary">Back</a>
  </div>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-3"><label class="form-label">Factory</label><input class="form-control" value="{{ request.user.profile.factory.name }}" readonly></div>
      <div class="col-md-3">
        <label class="form-label">Production Line</label>
        {% if selected_line %}<input class="form-control" value="{{ selected_line.line_name }}" readonly>
        {% else %}<select name="production_line" class="form-select" required><option value="">Select assigned line</option>{% for line in assigned_lines %}<option value="{{ line.id }}">{{ line.line_name }}</option>{% endfor %}</select>{% endif %}
      </div>
      <div class="col-md-3">
        <label class="form-label">Production Order</label>
        <select name="production_order" class="form-select" required>
          <option value="">Select order</option>
          {% for order in production_orders %}
          <option value="{{ order.id }}">{{ order.order_number }} - {{ order.article.article_code }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Article</label>
        <select name="article" class="form-select" required>
          <option value="">Select article</option>
          {% for article in articles %}
          <option value="{{ article.id }}">{{ article.article_code }} - {{ article.article_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Inspected Qty</label>
        <input type="number" name="inspected_quantity" min="0" value="0" class="form-control" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Passed Qty</label>
        <input type="number" name="passed_quantity" min="0" value="0" class="form-control" required>
      </div>
    </div>

    <button type="button" class="btn btn-outline-danger mt-4" id="show-defect-button">Defect</button>

    <div class="card mt-3 {% if not request.GET.show_defect %}d-none{% endif %}" id="defect-panel">
      <div class="card-body">
        <h5>Defect Details</h5>
        <div class="row g-3 align-items-end defect-row">
          <div class="col-md-4">
            <label class="form-label">Defect</label>
            <select name="defect_code" class="form-select">
              <option value="">Select defect</option>
              {% for defect in defects %}
              <option value="{{ defect.defect_code }}">{{ defect.defect_code }} - {{ defect.defect_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Qty</label>
            <input type="number" name="defect_quantity" min="0" value="0" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Repaired Qty</label>
            <input type="number" name="repaired_quantity" min="0" value="0" class="form-control">
          </div>
          <div class="col-md-2">
            <div class="form-check">
              <input type="checkbox" name="resolved" value="on" class="form-check-input" id="resolved">
              <label class="form-check-label" for="resolved">Resolved</label>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Defect Image</label>
            <input type="file" name="defect_image" class="form-control" accept="image/*">
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Save Quality Check</button>
    </div>
  </form>
</div>
<script>
  document.getElementById('show-defect-button').addEventListener('click', function () {
    document.getElementById('defect-panel').classList.toggle('d-none');
  });
</script>
{% endblock %}
