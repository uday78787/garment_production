{% extends 'base.html' %}
{% block title %}Add Defect Master{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Add Defect Definition</h3>
    <a href="{% url 'quality:defect_master_list' %}" class="btn btn-outline-secondary">Back</a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Defect Code</label>
            <input type="text" name="defect_code" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Defect Name</label>
            <input type="text" name="defect_name" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Department / DCL Group</label>
            <input type="text" name="department" class="form-control" placeholder="SEWING">
          </div>
          <div class="col-md-2">
            <label class="form-label">Operation</label>
            <input type="text" name="operation" class="form-control" placeholder="Sewing">
          </div>
          <div class="col-md-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
              {% for value, label in categories.choices %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Severity</label>
            <select name="severity" class="form-select">
              {% for value, label in severities.choices %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary">Save Defect</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
