{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 mt-4"><div class="card shadow-sm"><div class="card-body">
<h4 class="mb-3">Change Password</h4>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Update Password</button>
</form>
</div></div></div></div>
{% endblock %}
