{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 mt-4"><div class="card shadow-sm"><div class="card-body">
<h4 class="mb-3">Set New Password</h4>
{% if validlink %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Set New Password</button>
</form>
{% else %}
<div class="alert alert-danger">This password reset link is invalid, possibly because it has already been used.</div>
{% endif %}
</div></div></div></div>
{% endblock %}
